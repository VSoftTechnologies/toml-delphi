# DPM package spec file
# Used to build packages

min client version: 1.0
# metadata describes the package to the user
metadata:
  id: VSoft.PyScripter.TOML
  version: 1.0.0
  authors: [ Kiriakos Vlahos ]
  description: TOML parser, writer and serializer for Delphi
  projectUrl: https://github.com/VSoftTechnologies/toml-delphi
  repositoryUrl: https://github.com/VSoftTechnologies/toml-delphi
  repositoryCommit: #HASH#
  license: MIT
  readme: README.md
  copyright: Kiriakos Vlahos and contributors
  tags: [ toml, parser ]

variables:
  packageSource: Rad Studio $compilernoprefix$ 

targetPlatforms:
  - compiler: delphi10.4
    platforms: [ win32, win64, linux64, macos64 ]
  - compiler from: delphi11.0
    compiler to: delphi12.0
    platforms: [ win32, win64, linux64, macos64, macosarm64 ]
  - compiler: delphi13.0
    platforms: [ win32, win64, winarm64ec, linux64, macos64, macosarm64 ]

templates:
  - name: default
    source:
      - src: ./LICENSE
      - src: ./sources/*.pas
      - src: ./packages/$packageSource$/PyScripter.TOMLR.dpk
      - src: ./packages/$packageSource$/PyScripter.TOMLR.dproj
    build:
      - project: ./packages/$packageSource$/PyScripter.TOMLR.dproj
